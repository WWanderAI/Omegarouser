<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Omegarouser — Поиск</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #F1F9F4;
    font-family: -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
  }
  .topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #0F3D24;
    padding: 14px 16px;
  }
  .topbar .brand-mark { flex-shrink: 0; }
  .topbar input {
    flex: 1;
    height: 38px;
    border-radius: 20px;
    border: none;
    outline: none;
    padding: 0 16px;
    font-size: 14px;
  }
  .topbar button {
    background: #34A853;
    border: none;
    color: #fff;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .results {
    padding: 14px;
    max-width: 640px;
    margin: 0 auto;
  }

  .status {
    text-align: center;
    color: #4c7a52;
    font-size: 14px;
    padding: 40px 20px;
  }

  .card {
    display: block;
    background: #ffffff;
    border-radius: 14px;
    margin-bottom: 14px;
    overflow: hidden;
    text-decoration: none;
    box-shadow: 0 2px 8px rgba(11,61,36,0.08);
    animation: fadeSlideUp 0.4s ease-out backwards;
  }
  .card-media {
    position: relative;
    width: 100%;
    height: 160px;
    background: #DCEFE1;
    overflow: hidden;
  }
  .card-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .play-badge {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(15,61,36,0.75);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card-body {
    padding: 12px 14px;
  }
  .card-source {
    font-size: 11px;
    color: #34A853;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    margin-bottom: 4px;
  }
  .card-title {
    font-size: 15.5px;
    color: #0F3D24;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 4px;
  }
  .card-snippet {
    font-size: 13px;
    color: #5f6368;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="topbar">
  <svg class="brand-mark" viewBox="0 0 108 108" width="30" height="30" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="108" height="108" rx="24" fill="#34A853"/>
    <path fill="#ffffff" d="M54,30 A24,24 0 1,0 54,78 A24,24 0 1,0 54,30 Z M54,40 A14,14 0 1,1 54,68 A14,14 0 1,1 54,40 Z"/>
    <path fill="#0B8043" d="M54,40 A14,14 0 0,1 68,54 L54,54 Z"/>
    <path fill="#66BB6A" d="M54,68 A14,14 0 0,1 40,54 L54,54 Z"/>
    <path fill="#137333" d="M40,54 A14,14 0 0,1 54,40 L54,54 Z"/>
  </svg>
  <input id="q" type="text" autocomplete="off" />
  <button id="searchBtn" aria-label="Искать">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="11" cy="11" r="7" stroke="#ffffff" stroke-width="2"/>
      <line x1="16.4" y1="16.4" x2="21" y2="21" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>
</div>

<div class="results" id="results">
  <div class="status" id="status">Загрузка результатов…</div>
</div>

<script>
  function getQueryParam(name) {
    var params = new URLSearchParams(window.location.search);
    return params.get(name) || '';
  }

  function isVideoUrl(url) {
    return /youtube\.com\/watch|youtu\.be\/|vimeo\.com\//.test(url);
  }

  function escapeHtml(s) {
    var div = document.createElement('div');
    div.textContent = s || '';
    return div.innerHTML;
  }

  function extractThumbnail(item) {
    if (item.pagemap) {
      if (item.pagemap.cse_thumbnail && item.pagemap.cse_thumbnail[0]) {
        return item.pagemap.cse_thumbnail[0].src;
      }
      if (item.pagemap.cse_image && item.pagemap.cse_image[0]) {
        return item.pagemap.cse_image[0].src;
      }
    }
    return null;
  }

  function renderResults(items) {
    var container = document.getElementById('results');
    if (!items || items.length === 0) {
      container.innerHTML = '<div class="status">Ничего не найдено</div>';
      return;
    }
    var html = '';
    items.forEach(function (item, index) {
      var thumb = extractThumbnail(item);
      var video = isVideoUrl(item.link);
      var delay = (index * 0.05).toFixed(2);
      html += '<a class="card" href="' + item.link + '" style="animation-delay:' + delay + 's">';
      if (thumb) {
        html += '<div class="card-media"><img src="' + thumb + '" alt="" onerror="this.parentNode.style.display=\'none\'">' +
          (video ? '<div class="play-badge"><svg width="20" height="20" viewBox="0 0 24 24"><path fill="#fff" d="M8 5v14l11-7z"/></svg></div>' : '') +
          '</div>';
      }
      html += '<div class="card-body">' +
        '<div class="card-source">' + escapeHtml(item.displayLink || '') + '</div>' +
        '<div class="card-title">' + escapeHtml(item.title) + '</div>' +
        '<div class="card-snippet">' + escapeHtml(item.snippet || '') + '</div>' +
        '</div></a>';
    });
    container.innerHTML = html;
  }

  function showError(text) {
    document.getElementById('results').innerHTML = '<div class="status">' + escapeHtml(text) + '</div>';
  }

  function runSearch(query) {
    if (!query) return;
    document.getElementById('results').innerHTML = '<div class="status">Загрузка результатов…</div>';

    if (typeof OmegaSearchBridge === 'undefined') {
      showError('Поиск не настроен. Открой Настройки и укажи API-ключ.');
      return;
    }

    var apiKey = OmegaSearchBridge.getApiKey();
    var cseId = OmegaSearchBridge.getCseId();

    if (!apiKey || !cseId) {
      showError('Поиск не настроен. Открой Настройки и укажи API-ключ и ID поисковой системы.');
      return;
    }

    var url = 'https://www.googleapis.com/customsearch/v1?key=' + encodeURIComponent(apiKey) +
      '&cx=' + encodeURIComponent(cseId) + '&q=' + encodeURIComponent(query);

    fetch(url)
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.error) {
          showError('Ошибка API: ' + (data.error.message || 'неизвестная ошибка'));
          return;
        }
        renderResults(data.items);
      })
      .catch(function () {
        showError('Нет соединения — не удалось загрузить результаты');
      });
  }

  var initialQuery = getQueryParam('q');
  document.getElementById('q').value = initialQuery;
  runSearch(initialQuery);

  document.getElementById('searchBtn').addEventListener('click', function () {
    runSearch(document.getElementById('q').value.trim());
  });
  document.getElementById('q').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') runSearch(document.getElementById('q').value.trim());
  });
</script>
</body>
</html>
