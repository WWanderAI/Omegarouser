<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Omegarouser</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #FFFFFF;
    font-family: -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 92vh;
    padding: 28px 20px;
  }
  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .logo {
    font-size: 52px;
    font-weight: 800;
    letter-spacing: -1.5px;
    margin-bottom: 30px;
    display: flex;
    animation: fadeSlideUp 0.5s ease-out;
  }
  .logo span:nth-child(4n+1) { color: #4285F4; }
  .logo span:nth-child(4n+2) { color: #EA4335; }
  .logo span:nth-child(4n+3) { color: #FBBC05; }
  .logo span:nth-child(4n)   { color: #34A853; }

  form {
    width: 100%;
    max-width: 560px;
    animation: fadeSlideUp 0.5s ease-out 0.08s backwards;
  }
  .search-box {
    display: flex;
    align-items: center;
    background: #ffffff;
    border: 1px solid #DFE1E5;
    border-radius: 28px;
    padding: 12px 18px;
    box-shadow: 0 1px 6px rgba(32, 33, 36, 0.12);
    transition: box-shadow 0.2s ease;
  }
  .search-box:focus-within {
    box-shadow: 0 2px 10px rgba(66, 133, 244, 0.25);
    border-color: #4285F4;
  }
  .search-box input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 17px;
    background: transparent;
    color: #202124;
  }
  .search-box .icon {
    display: flex;
    align-items: center;
    padding: 0 6px;
    flex-shrink: 0;
  }
  .buttons {
    margin-top: 22px;
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    animation: fadeSlideUp 0.5s ease-out 0.16s backwards;
  }
  .buttons button {
    background: #4285F4;
    border: 1px solid #4285F4;
    border-radius: 4px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 500;
    color: #ffffff;
    transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
    box-shadow: 0 1px 2px rgba(60,64,67,0.2);
  }
  .buttons button:active {
    background: #3367D6;
    transform: scale(0.97);
  }

  .quick-links {
    margin-top: 36px;
    display: flex;
    gap: 18px;
    justify-content: center;
    flex-wrap: wrap;
    max-width: 420px;
    animation: fadeSlideUp 0.5s ease-out 0.24s backwards;
  }
  .quick-link {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    width: 64px;
    transition: transform 0.15s ease;
  }
  .quick-link:active { transform: scale(0.93); }
  .quick-link .bubble {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    font-size: 18px;
    font-weight: 700;
    box-shadow: 0 1px 4px rgba(32, 33, 36, 0.24);
    transition: box-shadow 0.15s ease;
  }
  .quick-link .label {
    margin-top: 6px;
    font-size: 12px;
    color: #5f6368;
    text-align: center;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <span>O</span><span>m</span><span>e</span><span>g</span><span>a</span><span>r</span><span>o</span><span>u</span><span>s</span><span>e</span><span>r</span>
  </div>

  <form id="searchForm">
    <div class="search-box">
      <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="11" cy="11" r="7" stroke="#4285F4" stroke-width="2"/>
        <line x1="16.4" y1="16.4" x2="21" y2="21" stroke="#4285F4" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input id="q" type="text" placeholder="Поиск в интернете" autocomplete="off" autofocus />
    </div>
    <div class="buttons">
      <button type="submit">Поиск Omegarouser</button>
    </div>
  </form>

  <div class="quick-links">
    <a class="quick-link" href="https://www.youtube.com">
      <div class="bubble" style="background:#FF0000;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M9.5,8.5 L16,12 L9.5,15.5 Z" fill="#ffffff"/>
        </svg>
      </div>
      <div class="label">YouTube</div>
    </a>
    <a class="quick-link" href="https://vk.com">
      <div class="bubble" style="background:#0077FF; font-size:16px;">VK</div>
      <div class="label">VK</div>
    </a>
    <a class="quick-link" href="https://web.telegram.org">
      <div class="bubble" style="background:#26A5E4;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M21.5,3.5 L2.7,10.8 c-1.1,0.4 -1.1,1 -0.2,1.3 l4.8,1.5 l1.8,5.6 c0.2,0.6 0.4,0.8 0.9,0.8 c0.4,0 0.6,-0.2 0.8,-0.4 l2.3,-2.2 l4.8,3.5 c0.9,0.5 1.5,0.2 1.7,-0.8 l3.1,-14.5 C22.9,4 22.4,3.3 21.5,3.5 Z M17.8,7.4 l-8.2,7.4 -0.3,3 -1.5,-4.7 l9.3,-6.4 C17.5,6.4 17.9,6.7 17.8,7.4 Z" fill="#ffffff"/>
        </svg>
      </div>
      <div class="label">Telegram</div>
    </a>
    <a class="quick-link" href="https://ru.wikipedia.org">
      <div class="bubble" style="background:#000000;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="9" stroke="#ffffff" stroke-width="1.6"/>
          <ellipse cx="12" cy="12" rx="3.6" ry="9" stroke="#ffffff" stroke-width="1.6"/>
          <line x1="3" y1="12" x2="21" y2="12" stroke="#ffffff" stroke-width="1.6"/>
        </svg>
      </div>
      <div class="label">Wikipedia</div>
    </a>
    <a class="quick-link" href="https://github.com">
      <div class="bubble" style="background:#181717;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M12,2 C6.48,2 2,6.58 2,12.2 c0,4.5 2.87,8.31 6.84,9.66 c0.5,0.1 0.68,-0.22 0.68,-0.49 c0,-0.24 -0.01,-1.02 -0.01,-1.85 c-2.78,0.61 -3.37,-1.21 -3.37,-1.21 c-0.45,-1.18 -1.11,-1.49 -1.11,-1.49 c-0.91,-0.63 0.07,-0.62 0.07,-0.62 c1,0.07 1.53,1.05 1.53,1.05 c0.89,1.56 2.34,1.11 2.91,0.85 c0.09,-0.66 0.35,-1.11 0.63,-1.37 c-2.22,-0.25 -4.56,-1.14 -4.56,-5.06 c0,-1.12 0.39,-2.03 1.03,-2.75 c-0.1,-0.26 -0.45,-1.3 0.1,-2.71 c0,0 0.84,-0.27 2.75,1.05 c0.8,-0.23 1.65,-0.34 2.5,-0.34 c0.85,0 1.7,0.11 2.5,0.34 c1.91,-1.32 2.75,-1.05 2.75,-1.05 c0.55,1.41 0.2,2.45 0.1,2.71 c0.64,0.72 1.03,1.63 1.03,2.75 c0,3.93 -2.34,4.8 -4.57,5.06 c0.36,0.32 0.68,0.94 0.68,1.9 c0,1.37 -0.01,2.48 -0.01,2.81 c0,0.27 0.18,0.6 0.69,0.49 C19.14,20.5 22,16.7 22,12.2 C22,6.58 17.52,2 12,2 Z" fill="#ffffff"/>
        </svg>
      </div>
      <div class="label">GitHub</div>
    </a>
    <a class="quick-link" href="https://mail.google.com">
      <div class="bubble" style="background:#EA4335;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="5" width="18" height="14" rx="2" stroke="#ffffff" stroke-width="1.6"/>
          <path d="M4,6.5 L12,13 L20,6.5" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="label">Почта</div>
    </a>
  </div>
</div>

<script>
  function doSearch(q) {
    q = (q || "").trim();
    if (!q) return;
    window.location.href = "https://www.google.com/search?q=" + encodeURIComponent(q);
  }
  document.getElementById('searchForm').addEventListener('submit', function (e) {
    e.preventDefault();
    doSearch(document.getElementById('q').value);
  });
</script>
</body>
</html>
