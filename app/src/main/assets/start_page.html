<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Omegarouser</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: linear-gradient(180deg, #EAF9EE 0%, #DCF3E3 100%);
    font-family: -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 92vh;
    padding: 28px 20px;
  }
  .logo {
    font-size: 52px;
    font-weight: 800;
    letter-spacing: -1.5px;
    margin-bottom: 30px;
    display: flex;
  }
  .logo span:nth-child(4n+1) { color: #0B8043; }
  .logo span:nth-child(4n+2) { color: #34A853; }
  .logo span:nth-child(4n+3) { color: #66BB6A; }
  .logo span:nth-child(4n)   { color: #137333; }

  form { width: 100%; max-width: 560px; }
  .search-box {
    display: flex;
    align-items: center;
    background: #ffffff;
    border: 1px solid #CFE8D8;
    border-radius: 28px;
    padding: 12px 18px;
    box-shadow: 0 1px 6px rgba(11, 128, 67, 0.12);
  }
  .search-box input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 17px;
    background: transparent;
    color: #202124;
  }
  .search-box .icon {
    display: flex;
    align-items: center;
    padding: 0 6px;
    flex-shrink: 0;
  }
  .buttons {
    margin-top: 22px;
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .buttons button {
    background: #EAF7EE;
    border: 1px solid #D3ECDA;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    color: #1e4620;
  }
  .buttons button:active { background: #D3ECDA; }

  .quick-links {
    margin-top: 36px;
    display: flex;
    gap: 18px;
    justify-content: center;
    flex-wrap: wrap;
    max-width: 420px;
  }
  .quick-link {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    width: 64px;
  }
  .quick-link .bubble {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    font-size: 18px;
    font-weight: 700;
    box-shadow: 0 1px 4px rgba(11, 128, 67, 0.18);
  }
  .quick-link .label {
    margin-top: 6px;
    font-size: 12px;
    color: #2e4a32;
    text-align: center;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <span>O</span><span>m</span><span>e</span><span>g</span><span>a</span><span>r</span><span>o</span><span>u</span><span>s</span><span>e</span><span>r</span>
  </div>

  <form id="searchForm">
    <div class="search-box">
      <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="11" cy="11" r="7" stroke="#34A853" stroke-width="2"/>
        <line x1="16.4" y1="16.4" x2="21" y2="21" stroke="#34A853" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input id="q" type="text" placeholder="Поиск в интернете" autocomplete="off" autofocus />
    </div>
    <div class="buttons">
      <button type="submit">Поиск Omegarouser</button>
      <button type="button" id="luckyBtn">Мне повезёт</button>
    </div>
  </form>

  <div class="quick-links">
    <a class="quick-link" href="https://www.youtube.com">
      <div class="bubble" style="background:#0B8043;">Y</div>
      <div class="label">YouTube</div>
    </a>
    <a class="quick-link" href="https://vk.com">
      <div class="bubble" style="background:#34A853;">VK</div>
      <div class="label">VK</div>
    </a>
    <a class="quick-link" href="https://web.telegram.org">
      <div class="bubble" style="background:#137333;">T</div>
      <div class="label">Telegram</div>
    </a>
    <a class="quick-link" href="https://ru.wikipedia.org">
      <div class="bubble" style="background:#66BB6A;">W</div>
      <div class="label">Wikipedia</div>
    </a>
    <a class="quick-link" href="https://github.com">
      <div class="bubble" style="background:#0B8043;">Gh</div>
      <div class="label">GitHub</div>
    </a>
    <a class="quick-link" href="https://mail.google.com">
      <div class="bubble" style="background:#34A853;">M</div>
      <div class="label">Почта</div>
    </a>
  </div>
</div>

<script>
  function doSearch(q, lucky) {
    q = (q || "").trim();
    if (!q) return;
    var url = "https://www.google.com/search?q=" + encodeURIComponent(q);
    if (lucky) url += "&btnI=1";
    window.location.href = url;
  }
  document.getElementById('searchForm').addEventListener('submit', function (e) {
    e.preventDefault();
    doSearch(document.getElementById('q').value, false);
  });
  document.getElementById('luckyBtn').addEventListener('click', function () {
    doSearch(document.getElementById('q').value, true);
  });
</script>
</body>
</html>
