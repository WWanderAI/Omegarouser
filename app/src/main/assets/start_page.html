<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Omegarouser</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #0F3D24;
    font-family: -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
    overflow-x: hidden;
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(2px);
    opacity: 0.35;
    z-index: 0;
  }
  .blob-1 { width: 260px; height: 260px; background: #34A853; top: -80px; right: -80px; }
  .blob-2 { width: 180px; height: 180px; background: #66BB6A; bottom: 10%; left: -60px; }
  .blob-3 { width: 120px; height: 120px; background: #0B8043; top: 40%; right: -40px; }

  .page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .brand-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 22px 24px 0 24px;
    animation: fadeIn 0.5s ease-out;
  }
  .brand-mark {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: #34A853;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 800;
    font-size: 18px;
    flex-shrink: 0;
  }
  .brand-word {
    color: #EAF9EE;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: -0.3px;
  }

  .hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 20px 26px 60px 26px;
  }

  .hero-title {
    color: #FFFFFF;
    font-size: 30px;
    line-height: 1.25;
    font-weight: 800;
    margin: 0 0 8px 0;
    max-width: 320px;
    animation: fadeSlideUp 0.55s ease-out 0.05s backwards;
  }
  .hero-title span { color: #7EE0A3; }

  .hero-subtitle {
    color: #B7D9C4;
    font-size: 14px;
    margin: 0 0 28px 0;
    animation: fadeSlideUp 0.55s ease-out 0.12s backwards;
  }

  .search-card {
    background: #FFFFFF;
    border-radius: 14px;
    padding: 6px;
    display: flex;
    align-items: center;
    box-shadow: 0 10px 24px rgba(0,0,0,0.28);
    animation: fadeSlideUp 0.55s ease-out 0.18s backwards;
  }
  .search-card input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    padding: 12px 14px;
    font-size: 15px;
    color: #14291D;
  }
  .search-card button {
    border: none;
    background: #0F3D24;
    color: #fff;
    width: 44px;
    height: 44px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: transform 0.1s ease, background 0.15s ease;
  }
  .search-card button:active {
    transform: scale(0.94);
    background: #0B2F1B;
  }

  .hero-tags {
    display: flex;
    gap: 8px;
    margin-top: 18px;
    flex-wrap: wrap;
    animation: fadeSlideUp 0.55s ease-out 0.26s backwards;
  }
  .hero-tag {
    border: 1px solid #2E6B48;
    color: #CDE9D8;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 20px;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<div class="page">
  <div class="brand-row">
    <div class="brand-mark">O</div>
    <div class="brand-word">Omegarouser</div>
  </div>

  <div class="hero">
    <h1 class="hero-title">Найди что угодно<br><span>в один тап</span></h1>
    <p class="hero-subtitle">Твой личный браузер — без лишнего, с собственным лицом</p>

    <form id="searchForm">
      <div class="search-card">
        <input id="q" type="text" placeholder="Что ищем сегодня?" autocomplete="off" autofocus />
        <button type="submit" aria-label="Искать">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 12h13M13 6l6 6-6 6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </form>

    <div class="hero-tags">
      <span class="hero-tag">Быстро</span>
      <span class="hero-tag">Без слежки</span>
      <span class="hero-tag">Своё лицо</span>
    </div>
  </div>
</div>

<script>
  function doSearch(q) {
    q = (q || "").trim();
    if (!q) return;
    window.location.href = "https://www.google.com/search?q=" + encodeURIComponent(q);
  }
  document.getElementById('searchForm').addEventListener('submit', function (e) {
    e.preventDefault();
    doSearch(document.getElementById('q').value);
  });
</script>
</body>
</html>
