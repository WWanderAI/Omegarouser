<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Omegarouser</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #0F3D24;
    font-family: -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
    overflow-x: hidden;
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(2px);
    opacity: 0.35;
    z-index: 0;
  }
  .blob-1 { width: 260px; height: 260px; background: #34A853; top: -80px; right: -80px; }
  .blob-2 { width: 180px; height: 180px; background: #66BB6A; bottom: 10%; left: -60px; }
  .blob-3 { width: 120px; height: 120px; background: #0B8043; top: 40%; right: -40px; }

  .page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .brand-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 22px;
    animation: fadeIn 0.5s ease-out;
  }
  .brand-mark {
    flex-shrink: 0;
    display: block;
  }
  .brand-word {
    color: #EAF9EE;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: -0.3px;
  }

  .hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 26px 60px 26px;
  }

  .center-block {
    width: 100%;
    max-width: 420px;
    margin-top: 12vh;
  }

  .search-card {
    background: #FFFFFF;
    border-radius: 14px;
    padding: 6px;
    display: flex;
    align-items: center;
    box-shadow: 0 10px 24px rgba(0,0,0,0.28);
    animation: fadeSlideUp 0.55s ease-out 0.18s backwards;
  }
  .search-card input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    padding: 12px 14px;
    font-size: 15px;
    color: #14291D;
  }
  .search-card button {
    border: none;
    background: #0F3D24;
    color: #fff;
    width: 44px;
    height: 44px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: transform 0.1s ease, background 0.15s ease;
  }
  .search-card button:active {
    transform: scale(0.94);
    background: #0B2F1B;
  }

  .expand-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin: 16px auto 0 auto;
    background: transparent;
    border: none;
    color: #B7D9C4;
    font-size: 13px;
    padding: 8px 14px;
    cursor: pointer;
    animation: fadeSlideUp 0.55s ease-out 0.24s backwards;
  }
  .expand-btn svg {
    transition: transform 0.25s ease;
  }
  .expand-btn.open svg {
    transform: rotate(180deg);
  }

  .news-panel {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease;
  }
  .news-panel.open {
    max-height: 1400px;
  }
  .news-panel-inner {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .news-card {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 10px;
    text-decoration: none;
    overflow: hidden;
  }
  .news-card:active { background: rgba(255,255,255,0.12); }
  .news-card img {
    width: 64px;
    height: 64px;
    border-radius: 8px;
    object-fit: cover;
    flex-shrink: 0;
    background: rgba(255,255,255,0.1);
  }
  .news-card .news-text {
    flex: 1;
    min-width: 0;
  }
  .news-card .news-title {
    color: #EAF9EE;
    font-size: 13.5px;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .news-card .news-source {
    color: #7FB899;
    font-size: 11px;
    margin-top: 4px;
  }
  .news-status {
    color: #B7D9C4;
    font-size: 13px;
    text-align: center;
    padding: 16px 0;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<div class="page">
  <div class="hero">
    <div class="center-block">
      <div class="brand-row">
        <svg class="brand-mark" viewBox="0 0 108 108" width="34" height="34" xmlns="http://www.w3.org/2000/svg">
          <rect x="0" y="0" width="108" height="108" rx="24" fill="#34A853"/>
          <path fill="#ffffff" d="M54,30 A24,24 0 1,0 54,78 A24,24 0 1,0 54,30 Z M54,40 A14,14 0 1,1 54,68 A14,14 0 1,1 54,40 Z"/>
          <path fill="#0B8043" d="M54,40 A14,14 0 0,1 68,54 L54,54 Z"/>
          <path fill="#66BB6A" d="M54,68 A14,14 0 0,1 40,54 L54,54 Z"/>
          <path fill="#137333" d="M40,54 A14,14 0 0,1 54,40 L54,54 Z"/>
        </svg>
        <div class="brand-word">Omegarouser</div>
      </div>

      <form id="searchForm">
        <div class="search-card">
          <input id="q" type="text" placeholder="Что ищем сегодня?" autocomplete="off" autofocus />
          <button type="submit" aria-label="Искать">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M5 12h13M13 6l6 6-6 6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </form>

      <button type="button" id="expandBtn" class="expand-btn">
        <span id="expandLabel">Развернуть</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 9l6 6 6-6" stroke="#B7D9C4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div id="newsPanel" class="news-panel">
        <div id="newsPanelInner" class="news-panel-inner">
          <div class="news-status" id="newsStatus">Загрузка новостей…</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  function doSearch(q) {
    q = (q || "").trim();
    if (!q) return;
    window.location.href = "https://www.google.com/search?q=" + encodeURIComponent(q);
  }
  document.getElementById('searchForm').addEventListener('submit', function (e) {
    e.preventDefault();
    doSearch(document.getElementById('q').value);
  });

  var expandBtn = document.getElementById('expandBtn');
  var newsPanel = document.getElementById('newsPanel');
  var expandLabel = document.getElementById('expandLabel');
  var newsLoaded = false;

  expandBtn.addEventListener('click', function () {
    var isOpen = newsPanel.classList.toggle('open');
    expandBtn.classList.toggle('open', isOpen);
    expandLabel.textContent = isOpen ? 'Свернуть' : 'Развернуть';
    if (isOpen && !newsLoaded) {
      newsLoaded = true;
      loadNews();
    }
  });

  function loadNews() {
    var feedUrl = encodeURIComponent('https://lenta.ru/rss/news');
    var apiUrl = 'https://api.rss2json.com/v1/api.json?rss_url=' + feedUrl;

    fetch(apiUrl)
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!data.items || data.items.length === 0) {
          showNewsStatus('Не удалось загрузить новости');
          return;
        }
        renderNews(data.items.slice(0, 10), data.feed ? data.feed.title : 'Новости');
      })
      .catch(function () {
        showNewsStatus('Нет соединения — новости недоступны');
      });
  }

  function extractImage(item) {
    if (item.thumbnail) return item.thumbnail;
    if (item.enclosure && item.enclosure.link) return item.enclosure.link;
    var match = /<img[^>]+src="([^">]+)"/.exec(item.description || item.content || '');
    return match ? match[1] : null;
  }

  function renderNews(items, sourceName) {
    var container = document.getElementById('newsPanelInner');
    container.innerHTML = '';
    items.forEach(function (item) {
      var img = extractImage(item);
      var card = document.createElement('a');
      card.className = 'news-card';
      card.href = item.link;
      card.innerHTML =
        (img ? '<img src="' + img + '" alt="" onerror="this.style.display=\'none\'">' : '') +
        '<div class="news-text">' +
          '<div class="news-title">' + escapeHtml(item.title) + '</div>' +
          '<div class="news-source">' + escapeHtml(sourceName || '') + '</div>' +
        '</div>';
      container.appendChild(card);
    });
  }

  function showNewsStatus(text) {
    var container = document.getElementById('newsPanelInner');
    container.innerHTML = '<div class="news-status">' + escapeHtml(text) + '</div>';
  }

  function escapeHtml(s) {
    var div = document.createElement('div');
    div.textContent = s || '';
    return div.innerHTML;
  }
</script>
</body>
</html>
