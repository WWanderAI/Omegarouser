<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Omegarouser</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #0F3D24;
    font-family: -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
    overflow-x: hidden;
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(2px);
    opacity: 0.35;
    z-index: 0;
  }
  .blob-1 { width: 260px; height: 260px; background: #34A853; top: -80px; right: -80px; }
  .blob-2 { width: 180px; height: 180px; background: #66BB6A; bottom: 10%; left: -60px; }
  .blob-3 { width: 120px; height: 120px; background: #0B8043; top: 40%; right: -40px; }

  .page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .brand-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 22px 24px 0 24px;
    animation: fadeIn 0.5s ease-out;
  }
  .brand-mark {
    flex-shrink: 0;
    display: block;
  }
  .brand-word {
    color: #EAF9EE;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: -0.3px;
  }

  .hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 20px 26px 60px 26px;
  }

  .search-card {
    background: #FFFFFF;
    border-radius: 14px;
    padding: 6px;
    display: flex;
    align-items: center;
    box-shadow: 0 10px 24px rgba(0,0,0,0.28);
    animation: fadeSlideUp 0.55s ease-out 0.18s backwards;
  }
  .search-card input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    padding: 12px 14px;
    font-size: 15px;
    color: #14291D;
  }
  .search-card button {
    border: none;
    background: #0F3D24;
    color: #fff;
    width: 44px;
    height: 44px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: transform 0.1s ease, background 0.15s ease;
  }
  .search-card button:active {
    transform: scale(0.94);
    background: #0B2F1B;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<div class="page">
  <div class="brand-row">
    <svg class="brand-mark" viewBox="0 0 108 108" width="34" height="34" xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="0" width="108" height="108" rx="24" fill="#34A853"/>
      <path fill="#ffffff" d="M54,30 A24,24 0 1,0 54,78 A24,24 0 1,0 54,30 Z M54,40 A14,14 0 1,1 54,68 A14,14 0 1,1 54,40 Z"/>
      <path fill="#0B8043" d="M54,40 A14,14 0 0,1 68,54 L54,54 Z"/>
      <path fill="#66BB6A" d="M54,68 A14,14 0 0,1 40,54 L54,54 Z"/>
      <path fill="#137333" d="M40,54 A14,14 0 0,1 54,40 L54,54 Z"/>
    </svg>
    <div class="brand-word">Omegarouser</div>
  </div>

  <div class="hero">
    <form id="searchForm">
      <div class="search-card">
        <input id="q" type="text" placeholder="Что ищем сегодня?" autocomplete="off" autofocus />
        <button type="submit" aria-label="Искать">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 12h13M13 6l6 6-6 6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </form>
  </div>
</div>

<script>
  function doSearch(q) {
    q = (q || "").trim();
    if (!q) return;
    window.location.href = "https://www.google.com/search?q=" + encodeURIComponent(q);
  }
  document.getElementById('searchForm').addEventListener('submit', function (e) {
    e.preventDefault();
    doSearch(document.getElementById('q').value);
  });
</script>
</body>
</html>
