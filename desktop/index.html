<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Omegarouser</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="tabStrip"></div>

<div id="toolbar">
  <button id="btnBack" class="nav-btn green" title="Назад">
    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="#fff" d="M20,11H7.83l5.59,-5.59L12,4l-8,8 8,8 1.41,-1.41L7.83,13H20z"/></svg>
  </button>
  <button id="btnForward" class="nav-btn green" title="Вперёд">
    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="#fff" d="M4,11h12.17l-5.59,-5.59L12,4l8,8 -8,8 -1.41,-1.41L16.17,13H4z"/></svg>
  </button>
  <button id="btnReload" class="nav-btn greenlight" title="Обновить">
    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="#fff" d="M17.65,6.35C16.2,4.9 14.21,4 12,4c-4.42,0 -7.99,3.58 -7.99,8s3.57,8 7.99,8c3.73,0 6.84,-2.55 7.73,-6h-2.08c-0.82,2.33 -3.04,4 -5.65,4 -3.31,0 -6,-2.69 -6,-6s2.69,-6 6,-6c1.66,0 3.14,0.69 4.22,1.78L13,11h7V4l-2.35,2.35z"/></svg>
  </button>

  <span id="sslIndicator" class="ssl-indicator" style="display:none;"></span>

  <div id="addressBarWrap">
    <input id="addressBar" type="text" placeholder="Поиск в интернете или адрес сайта" autocomplete="off">
    <div id="suggestions" class="suggestions" style="display:none;"></div>
  </div>

  <button id="btnNewTab" class="nav-btn green" title="Новая вкладка">
    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="#fff" d="M19,13h-6v6h-2v-6L5,13v-2h6L11,5h2v6h6v2z"/></svg>
  </button>

  <button id="btnMenu" class="nav-btn dark" title="Меню">
    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="#fff" d="M12,8c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM12,10c-1.1,0 -2,0.9 -2,2s0.9,2 2,2 2,-0.9 2,-2 -0.9,-2 -2,-2zM12,16c-1.1,0 -2,0.9 -2,2s0.9,2 2,2 2,-0.9 2,-2 -0.9,-2 -2,-2z"/></svg>
  </button>
</div>

<div id="menuDropdown" class="dropdown" style="display:none;">
  <div class="menu-item" data-action="home">Домой</div>
  <div class="menu-item" data-action="bookmark-toggle">Добавить в закладки</div>
  <div class="menu-item" data-action="bookmarks">Закладки</div>
  <div class="menu-item" data-action="history">История</div>
  <div class="menu-item" data-action="downloads">Загрузки</div>
  <div class="menu-item" data-action="find">Найти на странице</div>
  <div class="menu-item" data-action="private-tab">Новая приватная вкладка</div>
  <div class="menu-item" data-action="settings">Настройки</div>
</div>

<div id="findBar" style="display:none;">
  <input id="findQuery" type="text" placeholder="Найти на странице" autocomplete="off">
  <span id="findMatchCount"></span>
  <button id="findPrev" class="text-btn">˄</button>
  <button id="findNext" class="text-btn">˅</button>
  <button id="findClose" class="text-btn">✕</button>
</div>

<progress id="progressBar" value="0" max="100" style="display:none;"></progress>

<div id="webviewContainer"></div>

<!-- Оверлеи-панели -->
<div id="panelOverlay" class="panel-overlay" style="display:none;">
  <div id="panelHistory" class="panel" style="display:none;">
    <div class="panel-header">
      <span class="panel-title">История</span>
      <button class="text-btn" data-clear="history">Очистить</button>
      <button class="text-btn" id="closeHistoryPanel">✕</button>
    </div>
    <div id="historyList" class="panel-list"></div>
  </div>

  <div id="panelBookmarks" class="panel" style="display:none;">
    <div class="panel-header">
      <span class="panel-title">Закладки</span>
      <button class="text-btn" data-clear="bookmarks">Очистить</button>
      <button class="text-btn" id="closeBookmarksPanel">✕</button>
    </div>
    <div id="bookmarksList" class="panel-list"></div>
  </div>

  <div id="panelDownloads" class="panel" style="display:none;">
    <div class="panel-header">
      <span class="panel-title">Загрузки</span>
      <button class="text-btn" id="closeDownloadsPanel">✕</button>
    </div>
    <div id="downloadsList" class="panel-list"></div>
  </div>

  <div id="panelSettings" class="panel" style="display:none;">
    <div class="panel-header">
      <span class="panel-title">Настройки</span>
      <button class="text-btn" id="closeSettingsPanel">✕</button>
    </div>
    <div class="panel-body">
      <div class="settings-row">
        <div>
          <div class="settings-row-title">Блокировка рекламы</div>
          <div class="settings-row-subtitle">Блокирует рекламные и трекинговые домены</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="settingsAdblock" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="settings-row" style="flex-direction:column; align-items:flex-start;">
        <div class="settings-row-title" style="margin-bottom:8px;">Поисковая система</div>
        <label class="radio-label"><input type="radio" name="searchEngine" value="google" checked> Google</label>
        <label class="radio-label"><input type="radio" name="searchEngine" value="yandex"> Яндекс</label>
        <label class="radio-label"><input type="radio" name="searchEngine" value="duckduckgo"> DuckDuckGo</label>
      </div>
    </div>
  </div>
</div>

<!-- Панель вкладок (список) -->
<div id="tabsOverlay" class="panel-overlay" style="display:none;">
  <div class="panel">
    <div class="panel-header">
      <span class="panel-title">Вкладки</span>
      <button class="text-btn" id="closeTabsOverlay">✕</button>
    </div>
    <div id="tabsList" class="panel-list"></div>
  </div>
</div>

<script src="renderer.js"></script>
</body>
</html>
